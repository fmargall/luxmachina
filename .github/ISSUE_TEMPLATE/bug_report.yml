# Issue form syntax:
# https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/syntax-for-issue-forms
name: 🐛 Bug report
description: Something does not work as documented, crashes or gives wrong results.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in the fields
        below so that it can be reproduced. Usage questions are better asked in
        [Discussions](https://github.com/fmargall/luxmachina/discussions/categories/q-a).

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the [existing issues](https://github.com/fmargall/luxmachina/issues?q=is%3Aissue) and found no duplicate.
          required: true
        - label: I reproduced the bug with the latest released version of luxmachina.
          required: false

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Where is the bug?
      options:
        - Library (Python API, kernels, results)
        - Documentation
        - Packaging or installation
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproducible example
      description: |
        The shortest self-contained code that triggers the bug. It must run as
        is, without your own data files if possible.
      render: python
      placeholder: |
        import luxmachina
        ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error message or output
      description: The full traceback or the wrong output. It is formatted as code automatically.
      render: text

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        GPU bugs often depend on the device, the driver and the CUDA version.
        Run this command and paste its output:

        ```
        python -c "import platform, sys, luxmachina, warp; print(f'luxmachina {luxmachina.__version__}'); print(f'Python {sys.version}'); print(platform.platform()); warp.init()"
        ```
      render: text
    validations:
      required: true
