coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 90%

codecov:
  notify:
    # It should be lower or equal to the matrix
    # size of the tests job in the CI workflow.
    after_n_builds: 5

comment:
  # It should be lower or equal to the matrix
  # size of the tests job in the CI workflow.
  after_n_builds: 5
