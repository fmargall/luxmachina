line-length = 100
target-version = "py310"

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "UP",       # pyupgrade
    "SIM",      # flake8-simplify
    "C4",       # flake8-comprehensions
    "NPY",      # numpy-specific rules
    "PTH",      # prefer pathlib over os.path
    "RUF",      # ruff-specific rules
    "D",        # pydocstyle
    "ANN",      # flake8-annotations: require explicit signatures
    "TC",       # flake8-type-checking: move typing-only imports under TYPE_CHECKING
]
ignore = [
    "E501",     # line length is handled by the formatter
    "D105",     # magic methods do not need docstrings
    "D107",     # __init__ is documented at class level
    "ANN401",   # typing.Any is how Warp marks the generic parameters of kernels
]

[lint.pydocstyle]
convention = "numpy"

[lint.flake8-type-checking]
# Quote annotations when moving an import under TYPE_CHECKING, so that
# no `from __future__ import annotations` is needed
quote-annotations = true
# Warp reads these annotations at runtime: their imports must stay real.
# Names are fully qualified, so `import warp as wp` is resolved too.
runtime-evaluated-decorators = ["warp.kernel", "warp.func", "warp.struct"]

[lint.per-file-ignores]
"tests/**" = ["D", "ANN"]
