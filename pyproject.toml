[build-system]
requires = ["setuptools >= 77", "setuptools-scm >= 8"]
build-backend = "setuptools.build_meta"

[project]
name = "luxmachina"
dynamic = ["version"]
description = "Differentiable GPU light tracer for optical system design and metrology, built on NVIDIA Warp"
authors = [
    { name = "François Margall", email = "fr.margall@proton.me" },
]
keywords = [
    "differentiable-rendering",
    "inverse-rendering",
    "light-tracing",
    "ray-tracing",
    "optics",
    "optical-design",
    "gpu",
    "nvidia-warp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE.txt"]
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/fmargall/luxmachina"
Repository = "https://github.com/fmargall/luxmachina"
Issues = "https://github.com/fmargall/luxmachina/issues"

[project.optional-dependencies]
test = ["pytest"]
# pyright is pinned: each release can add new errors, upgrades must be deliberate.
# The "nodejs" extra ships Node.js as a wheel instead of downloading it at first run.
dev = ["ruff", "pre-commit", "pytest", "pyright[nodejs]==1.1.414"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["luxmachina*"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
# Tests are checked too: they are the first client of the public API
include = ["src", "tests"]
# Check against the oldest supported version, so newer syntax is rejected
pythonVersion = "3.10"
# Strict for the package; tests stay in standard mode, so that unannotated
# test functions and fixtures are accepted (consistent with ANN in ruff.toml)
typeCheckingMode = "standard"
strict = ["src"]
# Not part of strict mode: flag "# type: ignore" comments that no longer hide anything
reportUnnecessaryTypeIgnoreComment = "error"
